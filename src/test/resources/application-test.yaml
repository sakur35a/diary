# @ActiveProfiles("test")로 기본 local 프로필을 대체한다.
# local 설정의 vault:// import와 개발 DB 주소를 읽지 않고, DB 접속 정보는
# PostgresTestConfiguration의 @ServiceConnection으로만 공급한다.
spring:
  cloud:
    vault:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
  security:
    oauth2:
      client:
        registration:
          test:
            provider: test
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile
        provider:
          test:
            # 실제 SecurityFilterChain을 구성하되 외부 인증 서버의 discovery는 실행하지 않는다.
            # 이 주소는 로그인 테스트용 서버가 아니다. OAuth 왕복은 별도의 검증이 필요하다.
            authorization-uri: https://example.invalid/oauth/authorize
            token-uri: https://example.invalid/oauth/token
            user-info-uri: https://example.invalid/userinfo
            user-name-attribute: sub
app:
  domain: http://localhost:3000
  frontend:
    oauth-callback-url: http://localhost:3000/oauth/callback
