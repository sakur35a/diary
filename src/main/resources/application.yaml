spring:
  application:
    name: diary
  # MessageSourceConfig가 이 설정으로 ReloadableResourceBundleMessageSource를 구성한다.
  messages:
    # 운영 중 수정하려면 SPRING_MESSAGES_BASENAME=file:/etc/diary/messages 로 지정한다.
    # 외부 디렉터리에 messages.properties와 messages_ko.properties를 두며 확장자는 설정에서 생략한다.
    basename: classpath:messages
    fallback-to-system-locale: false # 지원하지 않는 언어는 기본 영어 메시지를 사용한다.
    cache-duration: 1s
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      connection-timeout: 2000
  profiles:
    default: local
